name: Update blog index

on:
  push:
    branches: [main]
    paths:
      - 'blog/*.md'
      - 'scripts/generate-blog-index.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate blog/index.json
        run: node scripts/generate-blog-index.mjs

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- blog/index.json; then
            echo "index.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/index.json
          git commit -m "chore: refresh blog/index.json"
          git push
